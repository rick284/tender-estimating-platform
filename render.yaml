services:
  - type: web
    name: tender-platform-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: DB_NAME
        value: tender_platform
      - key: MONGO_URL
        sync: false          # paste the Atlas connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render generates a long random secret
      - key: CORS_ORIGINS
        sync: false          # your Netlify site address, no trailing slash
      - key: BOOTSTRAP_EMAIL
        sync: false          # the email address of the workspace owner
      - key: REGISTRATION_OPEN
        value: "false"
      # Google Drive (read-only) - see docs/DRIVE_SETUP.md. Leave the first two blank until the Google steps are done.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://tender-platform-api.onrender.com/api/drive/callback
      - key: WEB_URL
        value: https://tender-estimating-platform.netlify.app
      - key: TOKEN_ENC_KEY
        generateValue: true  # encrypts the saved Google connection
      # AI drafting (Anthropic) - see docs/AI_SETUP.md. Leave ANTHROPIC_API_KEY blank until the key exists.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_MODEL
        value: claude-opus-5-5
